name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
        working-directory: .
      - name: Lint frontend
        run: npm run lint -- --max-warnings=0
      - name: Type-check frontend
        run: npx next typegen && npm run typecheck
      - name: Build frontend
        # Google Fonts sometimes returns extensionless /l/font?kit= URLs.
        # Turbopack then fails with "queries have exactly one entry" and
        # caches that CSS, so a retry has to delete .next (vercel/next.js#99114).
        run: |
          for attempt in 1 2 3 4; do
            if npm run build; then
              exit 0
            fi
            echo "next build failed on attempt ${attempt}. Clearing .next and retrying."
            rm -rf .next
          done
          exit 1

  deploy-production:
    name: Deploy to Vercel Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    # Run Vercel from the repo root: the Vercel project's Root Directory is already "frontend".
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@62.4.0
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        # Same Google Fonts flake as the check job. vercel build runs next
        # build in frontend/, so the cached CSS lives in frontend/.next.
        run: |
          for attempt in 1 2 3; do
            if vercel build --prod --token="$VERCEL_TOKEN"; then
              exit 0
            fi
            echo "vercel build failed on attempt ${attempt}. Clearing frontend/.next and retrying."
            rm -rf frontend/.next
          done
          exit 1
      - name: Deploy to Vercel Production
        id: deploy
        run: |
          output=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1)
          printf '%s\n' "$output"
          clean=$(printf '%s\n' "$output" | sed -r 's/\x1B\[[0-9;]*[mK]//g')
          url=$(printf '%s\n' "$clean" | sed -n 's/.*Aliased[[:space:]]*\(https:\/\/[^[:space:]]*\).*/\1/p' | tail -n 1)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$clean" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          fi
          if [ -z "$url" ]; then
            echo "vercel deploy did not print a production URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
