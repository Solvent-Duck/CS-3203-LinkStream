# GitHub Actions workflow automatically checks on pushes and pull requests (PR) that change files under frontend

name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # download codebase

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present # check code quality

      - name: Type-check
        run: npm run typecheck --if-present # check TypScript

      - name: Build
        run: npm run build # compile app and ensure no build-breaking errors